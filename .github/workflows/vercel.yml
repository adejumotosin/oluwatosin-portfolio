name: Deploy to Vercel

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_DIgHLaFQluSHfIFayzils70J
  VERCEL_PROJECT_ID: prj_54fjhkvsF0WAfihHQnVdjlfTSTNL
  VERCEL_SCOPE: oluwatosin-s-projects-31b5c057

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Verify Vercel authentication
        run: vercel whoami --token=${{ secrets.VERCEL_TOKEN }} --scope=$VERCEL_SCOPE

      - name: Pull preview configuration
        if: github.event_name == 'pull_request'
        run: vercel pull --yes --environment=preview --scope=$VERCEL_SCOPE --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build preview
        if: github.event_name == 'pull_request'
        run: vercel build --scope=$VERCEL_SCOPE --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy preview
        if: github.event_name == 'pull_request'
        run: vercel deploy --prebuilt --scope=$VERCEL_SCOPE --token=${{ secrets.VERCEL_TOKEN }}

      - name: Pull production configuration
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: vercel pull --yes --environment=production --scope=$VERCEL_SCOPE --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build production
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: vercel build --prod --scope=$VERCEL_SCOPE --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy production
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: vercel deploy --prebuilt --prod --scope=$VERCEL_SCOPE --token=${{ secrets.VERCEL_TOKEN }}
